name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    name: Test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check Airtable access is confined to lib/airtable.ts
        run: npm run check:airtable-filter

      - name: Build
        run: npm run build
