name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    name: Test, build
    runs-on: ubuntu-latest
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The browser Vitest project renders components in real Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # pg_dump 18, to match the server, for the test that checks
      # netlify/database/schema.sql is up to date. The runner's own is older.
      - name: Install the Postgres 18 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # Both Vitest projects (node and browser), gated on coverage.
      - name: Test with coverage
        run: npm test

      # Fails on warnings too. Our own rules keep Airtable, Luma and the
      # database each behind one file (eslint.config.mjs).
      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Find unused files, exports and dependencies
        run: npm run lint:unused

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  behaviour:
    name: Behaviour tests
    runs-on: ubuntu-latest
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keyed on the Playwright version rather than the lockfile hash, so an
      # unrelated dependency bump does not throw the browser away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: the behaviour project runs a single browser, and
      # downloading the rest costs more than it proves.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser but not the apt packages it links against,
      # which live outside ~/.cache/ms-playwright — so a cache hit still needs
      # the system libraries installing.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # pg_dump 18, to match the server: the build below runs the unit tests,
      # including the one that checks netlify/database/schema.sql is up to date.
      - name: Install the Postgres 18 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # playwright.config.ts's webServer builds and starts the app itself, so
      # there is no separate build step here. The public-vs-live suite is deliberately
      # not run: it compares against the live site, so it fails whenever news or
      # events change, which makes it a poor gate.
      - name: Behaviour tests
        run: npm run test:behaviour

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
