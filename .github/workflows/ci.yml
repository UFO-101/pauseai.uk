name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Five jobs, so each result arrives as soon as it's known: a formatting
  # slip shows up in a minute, not after the tests.
  checks:
    name: Lint, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Every check runs even if an earlier one fails, so one push reports
      # them all.
      # Fails on warnings too. Our own rules keep Airtable, Luma and the
      # database each behind one file (eslint.config.mjs).
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: Find unused files, exports and dependencies
        if: ${{ !cancelled() }}
        run: npm run lint:unused

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The browser Vitest project renders components in real Chromium.
      # Cached as the storyboard job caches it, below.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # pg_dump 18, to match the server, for the test that checks
      # netlify/database/schema.sql is up to date. The runner's own is older.
      - name: Install the Postgres 18 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # Both Vitest projects (node and browser), gated on coverage.
      - name: Test with coverage
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `next build` alone. Netlify's `npm run build` runs the unit tests and
      # the linters first, which the jobs above do, with a Postgres.
      - name: Build
        run: npx next build

  storyboard:
    name: Storyboard
    runs-on: ubuntu-latest
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keyed on the Playwright version rather than the lockfile hash, so an
      # unrelated dependency bump does not throw the browser away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: both of the storyboard's projects run in it, and
      # downloading the rest costs more than it proves.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser but not the apt packages it links against,
      # which live outside ~/.cache/ms-playwright — so a cache hit still needs
      # the system libraries installing.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # pg_dump 18, to match the server: the build below runs the unit tests,
      # including the one that checks netlify/database/schema.sql is up to date.
      - name: Install the Postgres 18 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # playwright.config.ts's webServer builds and starts the app itself, so
      # there is no separate build step here. The gate takes no screenshots;
      # the comparison with main (npm run storyboard) is run by hand.
      - name: Storyboard
        run: npm run test:storyboard

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The database backup's own package (backup/README.md): its tests, with
  # their coverage gate, and its types.
  backup:
    name: Backup
    runs-on: ubuntu-latest
    # Its tests make their own databases in this Postgres, as the site's do.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backup/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The server too, not just the client: each backup is restored into a
      # scratch Postgres of its own, made with initdb and pg_ctl.
      - name: Install Postgres 18
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Test with coverage
        run: npm test

      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
