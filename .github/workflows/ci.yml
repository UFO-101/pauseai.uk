name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    name: Test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check Airtable access is confined to lib/airtable.ts
        run: npm run check:airtable-filter

      - name: Build
        run: npm run build

  behaviour:
    name: Behaviour tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Keyed on the Playwright version rather than the lockfile hash, so an
      # unrelated dependency bump does not throw the browser away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: the behaviour project runs a single browser, and
      # downloading the rest costs more than it proves.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser but not the apt packages it links against,
      # which live outside ~/.cache/ms-playwright — so a cache hit still needs
      # the system libraries installing.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts's webServer builds and starts the app itself, so
      # there is no separate build step here. The visual suite is deliberately
      # not run: it diffs against the live site, so it fails whenever news or
      # events change, which makes it a poor gate.
      - name: Behaviour tests
        run: npm run test:behaviour

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
