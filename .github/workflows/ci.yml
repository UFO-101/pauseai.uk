name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Separate jobs, so each result arrives as soon as it's known: a formatting
  # slip shows up in a minute, not after the tests.
  checks:
    name: Lint, format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # node_modules itself, kept for each lockfile and Node version: unpacking
      # it takes seconds, where npm ci takes most of a minute. Every job of
      # the site's does the same. Nothing is installed outside node_modules.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Every check runs even if an earlier one fails, so one push reports
      # them all.
      # Fails on warnings too. Our own rules keep Airtable, Luma and the
      # database each behind one file (eslint.config.mjs).
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Lint CSS
        if: ${{ !cancelled() }}
        run: npm run lint:css

      - name: Find unused files, exports and dependencies
        if: ${{ !cancelled() }}
        run: npm run lint:unused

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Azure's Ubuntu mirror sometimes stalls partway through a download, and
      # apt waits on it for as long as the job may run. Every apt-get below,
      # Playwright's too, gives up on one that sends nothing for 20 seconds and
      # tries it again, up to three times.
      - name: Make apt retry stalled downloads
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The browser Vitest project renders components in real Chromium.
      # Cached as the storyboard job caches it, below.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Postgres's own package source, added by hand as its instructions give
      # (https://wiki.postgresql.org/wiki/Apt) rather than with its script, which
      # runs an apt-get update of its own: the one update is Playwright's, below.
      # apt keeps what it downloads in ~/apt-archives, cached for each runner
      # image and Playwright version, so a job with the cache downloads none.
      - name: Set up apt's sources and downloads
        id: apt
        timeout-minutes: 2
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/81-archives
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 --max-time 30 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Cache apt's downloads
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.apt.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-${{ runner.os }}-

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # A stalled download fails here, not at the job's limit.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        # A mirror that trickles rather than stalls gets past apt's retries,
        # so each attempt has two minutes and is tried again, three times in
        # all. Timeout stops npx but not the apt-get it started under sudo,
        # which holds dpkg's lock, so that is killed and waited for before
        # dpkg finishes anything it left half done.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=10 120 npx playwright install-deps chromium && exit 0
            echo "::warning::Playwright's system dependencies, attempt $attempt, failed or took over two minutes"
            sudo pkill -KILL -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 1; done
            sudo dpkg --configure -a
          done
          exit 1

      # pg_dump 18, to match the server, for the test that checks
      # netlify/database/schema.sql is up to date. The runner's own is older.
      - name: Install the Postgres 18 client
        timeout-minutes: 4
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # apt's lock and part-downloads are root's, which the cache can't save.
          sudo chown -R "$USER" ~/apt-archives

      # Both Vitest projects (node and browser), gated on coverage.
      - name: Test with coverage
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Turbopack's work and the resized images from the last build, so this
      # one starts warm (Next checks what it reuses against the sources).
      # Kept for each commit, and taken from the newest there is.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-

      # `next build` alone. Netlify's `npm run build` runs the unit tests and
      # the linters first, which the jobs above do, with a Postgres.
      - name: Build
        run: npx next build

  # The flows split between three jobs, each building the site: the flows
  # are most of the time, the setup and the build a minute or so. Three
  # brings the slowest part under the Test job's time; Playwright splits by
  # number of flows, not their length, so the parts aren't the same length.
  storyboard-shard:
    name: Storyboard (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Tests that need a database make their own in this Postgres
    # (tests/database.ts, scripts/fresh-database.mjs).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Azure's Ubuntu mirror sometimes stalls partway through a download, and
      # apt waits on it for as long as the job may run. Every apt-get below,
      # Playwright's too, gives up on one that sends nothing for 20 seconds and
      # tries it again, up to three times.
      - name: Make apt retry stalled downloads
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # As the first job does: node_modules, kept for each lockfile and Node version.
      - name: Cache dependencies
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Keyed on the Playwright version rather than the lockfile hash, so an
      # unrelated dependency bump does not throw the browser away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # As the Test job does: Postgres's package source, and apt's downloads cached.
      - name: Set up apt's sources and downloads
        id: apt
        timeout-minutes: 2
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/81-archives
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 --max-time 30 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Cache apt's downloads
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.apt.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-${{ runner.os }}-

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only Chromium: both of the storyboard's projects run in it, and
      # downloading the rest costs more than it proves.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # A stalled download fails here, not at the job's limit.
        timeout-minutes: 5
        run: npx playwright install chromium

      # The libraries the browser links against, outside the browser's cache.
      - name: Install Playwright system dependencies
        # A mirror that trickles rather than stalls gets past apt's retries,
        # so each attempt has two minutes and is tried again, three times in
        # all. Timeout stops npx but not the apt-get it started under sudo,
        # which holds dpkg's lock, so that is killed and waited for before
        # dpkg finishes anything it left half done.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=10 120 npx playwright install-deps chromium && exit 0
            echo "::warning::Playwright's system dependencies, attempt $attempt, failed or took over two minutes"
            sudo pkill -KILL -x apt-get || true
            while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 1; done
            sudo dpkg --configure -a
          done
          exit 1

      # psql 18, to match the server: each flow's database is made with it
      # (scripts/fresh-database.mjs).
      - name: Install the Postgres 18 client
        timeout-minutes: 4
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # apt's lock and part-downloads are root's, which the cache can't save.
          sudo chown -R "$USER" ~/apt-archives

      # As the Build job does, for the fixture build: kept apart, as its
      # settings differ.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-storyboard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-storyboard-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-storyboard-${{ matrix.shard }}-${{ runner.os }}-

      # playwright.config.ts's webServer builds and starts the app itself, so
      # there is no separate build step here. The gate takes no screenshots;
      # the comparison with main (npm run storyboard) is run by hand.
      - name: Storyboard
        run: npm run test:storyboard -- --shard=${{ matrix.shard }}/3

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One result for the three parts, under the storyboard check's own name.
  # It runs whatever they did, so a failed part fails it, rather than
  # leaving it skipped.
  storyboard:
    name: Storyboard
    needs: storyboard-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: test "${{ needs.storyboard-shard.result }}" = success

  # The database backup's own package (backup/README.md): its tests, with
  # their coverage gate, and its types.
  backup:
    name: Backup
    runs-on: ubuntu-latest
    # Its tests make their own databases in this Postgres, as the site's do.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backup
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Azure's Ubuntu mirror sometimes stalls partway through a download, and
      # apt waits on it for as long as the job may run. Every apt-get below,
      # Playwright's too, gives up on one that sends nothing for 20 seconds and
      # tries it again, up to three times.
      - name: Make apt retry stalled downloads
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "npm"
          cache-dependency-path: backup/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The server too, not just the client: each backup is restored into a
      # scratch Postgres of its own, made with initdb and pg_ctl.
      - name: Install Postgres 18
        timeout-minutes: 4
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Test with coverage
        run: npm test

      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run typecheck
